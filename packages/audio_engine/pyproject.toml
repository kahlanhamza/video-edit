[project]
name = "director-os-audio-engine"
version = "0.1.0"
description = "DirectorOS audio engine: FFmpeg chains (48kHz lock, slicing, ducking, speech-aware trims)"
requires-python = ">=3.12"
dependencies = ["director-os-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/director_os"]
