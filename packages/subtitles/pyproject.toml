[project]
name = "director-os-subtitles"
version = "0.1.0"
description = "DirectorOS subtitles: difflib word alignment + 2-row speaker-colored ASS builder"
requires-python = ">=3.12"
dependencies = [
    "director-os-core",
    "pysubs2>=1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/director_os"]
