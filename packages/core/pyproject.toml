[project]
name = "director-os-core"
version = "0.1.0"
description = "DirectorOS core: config, Pydantic contracts, SQLAlchemy models, storage, QA probe, fonts"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/director_os"]
