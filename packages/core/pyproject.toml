[project]
name = "director-os-core"
version = "0.1.0"
description = "DirectorOS core: config, Pydantic contracts, SQLAlchemy models, storage, QA probe, fonts"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "httpx>=0.27",
    "pysubs2>=1.7",
    # at-rest encryption for the settings vault (CR-008): without it
    # credentials.py silently degrades to plaintext even when
    # SETTINGS_SECRET_KEY is set — keys sat readable in the DB
    "cryptography>=42.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/director_os"]
