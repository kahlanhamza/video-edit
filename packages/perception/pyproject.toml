[project]
name = "director-os-perception"
version = "0.1.0"
description = "DirectorOS perception layer (M2/M4): shots, captions, ASR, audio events, OCR, multi-cam sync"
requires-python = ">=3.12"
dependencies = ["director-os-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/director_os"]
