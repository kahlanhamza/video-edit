[project]
name = "director-os-perception"
version = "0.1.0"
description = "DirectorOS perception layer (M2/M4): shots, captions, ASR, audio events, OCR, multi-cam sync"
requires-python = ">=3.12"
dependencies = [
    "director-os-core",
    "opencv-python-headless>=5.0.0.93",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pymupdf>=1.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/director_os"]
