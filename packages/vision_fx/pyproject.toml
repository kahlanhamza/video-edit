[project]
name = "director-os-vision-fx"
version = "0.1.0"
description = "DirectorOS vision FX: glass graphic cards + blur/redaction filter chains"
requires-python = ">=3.12"
dependencies = [
    "director-os-core",
    "pillow>=10.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/director_os"]
