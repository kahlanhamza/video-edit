[project]
name = "director-os-otio-engine"
version = "0.1.0"
description = "DirectorOS OTIO timeline engine: metadata contract, segment cache, render compiler"
requires-python = ">=3.12"
dependencies = [
    "director-os-core",
    "director-os-vision-fx",
    "opentimelineio>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/director_os"]
