[project]
name = "director-os-agent-runtime"
version = "0.1.0"
description = "DirectorOS agent runtime: typed tool registry for native function-calling"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/director_os"]
