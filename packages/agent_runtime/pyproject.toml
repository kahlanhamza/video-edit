[project]
name = "director-os-agent-runtime"
version = "0.2.0"
description = "DirectorOS agent runtime: typed tool registry, director editing tools, checkpoint/rollback"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-ai>=2.67.0",
    "director-os-core",
    "director-os-otio-engine",
    "director-os-subtitles",
    "director-os-skills",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/director_os"]
