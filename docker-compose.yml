services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: directoros
      POSTGRES_PASSWORD: directoros
      POSTGRES_DB: directoros
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U directoros"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: directoros
      MINIO_ROOT_PASSWORD: directoros-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://directoros:directoros@db:5432/directoros
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: s3
      R2_ENDPOINT: http://minio:9000
      R2_ACCESS_KEY_ID: directoros
      R2_SECRET_ACCESS_KEY: directoros-secret
      R2_BUCKET: directoros
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    command:
      ["celery", "-A", "director_os.worker.celery_app.celery_app", "worker", "-l", "info"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://directoros:directoros@db:5432/directoros
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: s3
      R2_ENDPOINT: http://minio:9000
      R2_ACCESS_KEY_ID: directoros
      R2_SECRET_ACCESS_KEY: directoros-secret
      R2_BUCKET: directoros
    healthcheck:
      test: ["CMD", "celery", "-A", "director_os.worker.celery_app.celery_app", "inspect", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Director Studio web UI — Milestone 3 (PLAN §8). Built; needs a web Dockerfile to run in compose.
  # web:
  #   build:
  #     context: .
  #     dockerfile: apps/web/Dockerfile
  #   ports:
  #     - "3000:3000"

volumes:
  pgdata:
  miniodata:
