[project]
name = "director-os"
version = "0.1.0"
description = "DirectorOS — autonomous multimodal video editing & documentary platform (monorepo root)"
requires-python = ">=3.12"
dependencies = [
    "director-os-core",
    "director-os-otio-engine",
    "director-os-audio-engine",
    "director-os-subtitles",
    "director-os-vision-fx",
    "director-os-agent-runtime",
    "director-os-perception",
    "director-os-api",
    "director-os-worker",
    "director-os-cli",
    "director-os-skills",
    "modal>=1.6.4",
]

[project.scripts]
director = "director_os.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv.workspace]
members = ["packages/*", "apps/api", "apps/worker", "apps/cli"]
# apps/web (Next.js, M3) is managed by its own package.json, not uv

[tool.uv.sources]
director-os-core = { workspace = true }
director-os-otio-engine = { workspace = true }
director-os-audio-engine = { workspace = true }
director-os-subtitles = { workspace = true }
director-os-vision-fx = { workspace = true }
director-os-agent-runtime = { workspace = true }
director-os-perception = { workspace = true }
director-os-api = { workspace = true }
director-os-worker = { workspace = true }
director-os-cli = { workspace = true }
director-os-skills = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM108", "B008"]

[tool.mypy]
python_version = "3.12"
mypy_path = "packages/core/src,packages/otio_engine/src,packages/audio_engine/src,packages/subtitles/src,packages/vision_fx/src,packages/agent_runtime/src,packages/perception/src,packages/skills/src,apps/api/src,apps/worker/src,apps/cli/src"
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true
check_untyped_defs = true
no_warn_unused_ignores = true
