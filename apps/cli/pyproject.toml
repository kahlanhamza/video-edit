[project]
name = "director-os-cli"
version = "0.1.0"
description = "DirectorOS CLI: `director render <url|path>` (PLAN §8 M1 done-when entrypoint)"
requires-python = ">=3.12"
dependencies = [
    "director-os-core",
    "director-os-otio-engine",
    "click>=8.1",
]

[project.scripts]
director = "director_os.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/director_os"]
