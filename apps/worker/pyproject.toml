[project]
name = "director-os-worker"
version = "0.1.0"
description = "DirectorOS Celery workers (render fleet; full media fleet in M2)"
requires-python = ">=3.12"
dependencies = [
    "director-os-core",
    "director-os-agent-runtime",
    "director-os-otio-engine",
    "director-os-perception",
    "celery[redis]>=5.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/director_os"]
